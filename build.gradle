plugins {
    id 'fabric-loom' version '1.15.2'
}

version = project.mod_version
base.archivesName = project.archives_base_name

repositories {
    mavenCentral()
}

dependencies {
    // Mojang mappings are implicit on 26.x (no mappings line needed).
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Compile-only: Elementa (UI toolkit Essential is built on) and the Kotlin stdlib it
    // exposes in its signatures. At runtime both come from the Essential mod itself.
    compileOnly files('libs/elementa-787.jar')
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.3.0'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
